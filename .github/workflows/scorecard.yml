name: Scorecard

# OpenSSF Scorecard (ADR-0078): a weekly score of this repository's supply-chain
# practices — branch protection, pinned dependencies, token permissions,
# dangerous workflows, signed releases, vulnerabilities.  Published to
# scorecard.dev (the README badge links the full report).  The results are not
# uploaded to Code scanning: several checks (Code-Review, Fuzzing,
# CII-Best-Practices) score a one-maintainer project low by construction and
# would sit there as alerts nobody can close.
#
# publish_results restricts this workflow to Scorecard's own allow-list:
# no `run:` steps, read-only token at the top, only the actions below.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # publish_results: signs the result for scorecard.dev
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
