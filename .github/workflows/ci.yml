name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Fast tests — no model downloads, no API keys ──────────────────────────
  # ADR-0053: CTIParsor no longer supports SQLite — the rule store moved onto
  # PostgreSQL alongside the job store, so DATABASE_URL (here,
  # CTIPARSOR_TEST_DATABASE_URL for the temp_db fixture) is required even for
  # the "fast" unit tests. This is also why the once-separate postgres-tests
  # job below is gone: it ran the exact same suite against the exact same
  # service this job now also needs, so it was pure duplication once every
  # job requires PostgreSQL regardless.
  fast-tests:
    name: Fast tests (lint + type check + unit tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Every install is constrained by requirements.lock.txt: the versions
      # tested here are the versions the image ships (`make lock`).
      - name: Install API dependencies (includes psycopg)
        run: pip install -c requirements.lock.txt -r requirements-api.txt

      - name: Install core pipeline dependencies (no torch / transformers)
        run: |
          pip install -c requirements.lock.txt \
            pydantic stix2 stix2-validator iocextract python-dotenv tenacity \
            rapidfuzz pyahocorasick anthropic \
            pdfplumber python-docx beautifulsoup4 defusedxml

      - name: Install test + lint dependencies
        run: pip install -c requirements.lock.txt pytest httpx -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check pipeline/ api/ models/ evaluation/ tests/ main.py --select E,F,W,I

      # Blocking since the tree reached zero errors (2026-09-27); mypy is pinned
      # in requirements-dev.txt so a new release cannot fail this on its own.
      - name: Type check (mypy)
        run: mypy pipeline/ api/ models/ evaluation/ --ignore-missing-imports

      - name: Run unit tests
        env:
          SKIP_HEAVY_MODELS: "1"
          ANTHROPIC_API_KEY: "test-key-not-used"
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: |
          pytest tests/ \
            --ignore=tests/eval_pipeline.py \
            -v \
            --cov=pipeline \
            --cov=api \
            --cov=models \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Frontend — type check + unit tests (vitest) ────────────────────────────
  frontend-tests:
    name: Frontend (type check + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (package-lock.json, exact)
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

  # ── Model tests — runs only on pushes to main (expensive: ~800 MB downloads) ──
  model-tests:
    name: Model tests (full pipeline, with model downloads)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Allow this job to fail without blocking the fast-tests result
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all dependencies (the image's exact versions)
        run: pip install -r requirements.lock.txt

      - name: Install test dependencies
        run: pip install -c requirements.lock.txt pytest httpx -r requirements-dev.txt

      - name: Run full test suite (with model inference)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: |
          pytest tests/ \
            --ignore=tests/eval_pipeline.py \
            -v \
            --cov=pipeline \
            --cov=api \
            --cov=models \
            --cov-report=term-missing

  # ── Container image — build it and run the smoke test (ADR-0044) ─────────────
  # Keeps the Dockerfile from rotting: a dependency that no longer installs on
  # python:3.12-slim, or a hardening flag Chromium stops tolerating, fails here.
  container-image:
    name: Container image (build + smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ctiparsor:ci
          build-args: |
            GIT_REV=${{ github.sha }}

      - name: Smoke test (health, UI, non-root, read-only root, Chromium sandbox, PostgreSQL job store)
        env:
          CTI_IMAGE: ctiparsor:ci
        run: |
          cp .env.example .env
          echo "CTI_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          bash scripts/docker_smoke.sh --no-build --clean

  # ── Publish to GHCR (ADR-0047) ────────────────────────────────────────────────
  # Only after the backend tests, the frontend tests and the smoke test pass
  # (an image whose code failed its own tests is never published), and only on main: a PR (including from a
  # fork) never has packages:write regardless — this `if` is defense in depth,
  # not the only control. Rebuilds with docker/build-push-action, but
  # cache-from: type=gha reuses the smoke-test job's layers, so this is a cheap
  # re-tag-and-push, not a second full build.
  publish-image:
    name: Publish image to GHCR
    needs: [fast-tests, frontend-tests, container-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase the image name (GHCR requires it; the repo owner is not)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (sha-<full sha>, latest, and semver if triggered by a v*.*.* tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
