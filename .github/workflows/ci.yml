name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no push needed (ADR-0078): pip-audit, npm audit and the image
  # scan meet the vulnerabilities published since the last run, on the
  # versions already shipped.  Model tests and publishing stay push-only.
  schedule:
    - cron: "23 5 * * 1"

# Every job reads the repository and nothing else unless it says so below
# (publish-image, container-image).  The repository default is read-only too;
# this holds if that setting ever changes.
permissions:
  contents: read

jobs:
  # ── Fast tests — no model downloads, no API keys ──────────────────────────
  # ADR-0053: CTIParsor no longer supports SQLite — the rule store moved onto
  # PostgreSQL alongside the job store, so DATABASE_URL (here,
  # CTIPARSOR_TEST_DATABASE_URL for the temp_db fixture) is required even for
  # the "fast" unit tests. This is also why the once-separate postgres-tests
  # job below is gone: it ran the exact same suite against the exact same
  # service this job now also needs, so it was pure duplication once every
  # job requires PostgreSQL regardless.
  fast-tests:
    name: Fast tests (lint + type check + unit tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      # yara-python publishes no wheel for Python 3.14 (ADR-0079): pip compiles
      # it, and without the OpenSSL headers the build drops the `hash` module
      # and PE signatures silently (tests/test_yara_check.py would then fail).
      - name: OpenSSL headers for the yara-python build
        run: dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev; }

      # requirements-ci.lock.txt (`make lock`, ADR-0080): the API, the light
      # pipeline dependencies (no torch / transformers) and the test, lint and
      # audit tools, at the versions the image ships, every file checked
      # against the sha256 the lock recorded.
      - name: Install dependencies (by hash)
        run: pip install --require-hashes -r requirements-ci.lock.txt

      # Scope and rules live in pyproject.toml, so `ruff check .` and `mypy`
      # check the same files here, in `make ci` and in an editor.
      - name: Lint (ruff)
        run: ruff check .

      # Blocking since the tree reached zero errors (2026-09-27); mypy is pinned
      # in requirements-dev.txt so a new release cannot fail this on its own.
      - name: Type check (mypy)
        run: mypy

      # tests/eval_pipeline.py runs here too (pytest.ini collects it).
      # CTIPARSOR_REQUIRE_TEST_DEPS turns a test skipped for a missing import
      # into a failure (tests/conftest.py).  Coverage: branch mode, the total
      # floor in pyproject.toml, then per-area floors (scripts/check_coverage.py).
      - name: Run unit tests
        env:
          SKIP_HEAVY_MODELS: "1"
          ANTHROPIC_API_KEY: "test-key-not-used"
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
          CTIPARSOR_REQUIRE_TEST_DEPS: "1"
        run: |
          pytest -v -rs \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Coverage floors per area (STIX mapping and validation, persistence)
        run: python scripts/check_coverage.py

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Dependency audit — the exact versions the image ships (ADR-0075) ────────
  # Blocking: a known vulnerability in requirements.lock.txt, or a high one in
  # the UI's production dependencies, fails the build unless SECURITY.md
  # accepts it with a reason. `--no-deps --disable-pip` audits the pins as
  # written, installing nothing; torch's +cpu build is not on PyPI, so
  # pip-audit says it cannot look it up and skips it.
  dependency-audit:
    name: Dependency audit (pip-audit on the lock, npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-audit (by hash, ADR-0080)
        run: pip install --require-hashes -r requirements-audit.lock.txt

      # The image's lock, CI's tools and the scanner's own dependencies, one
      # run each: pip-audit refuses a package that two -r files both list.
      # Every lock is audited before the step fails.
      - name: pip-audit (the three locks)
        run: |
          # PYSEC-2026-2447 (diskcache, pickle in a cache directory): accepted, see SECURITY.md.
          status=0
          for lock in requirements.lock.txt requirements-ci.lock.txt requirements-audit.lock.txt; do
            echo "== $lock"
            pip-audit -r "$lock" --no-deps --disable-pip --progress-spinner off \
              --ignore-vuln PYSEC-2026-2447 || status=1
          done
          exit "$status"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm audit (the UI's production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ── Dependency review — what a pull request adds (ADR-0078) ────────────────
  # The dependencies a PR adds or changes, in every manifest GitHub's
  # dependency graph reads (npm, actions, Python requirements): a known
  # vulnerability of high severity or worse fails the PR before it lands,
  # where dependency-audit above judges the whole lock after.
  dependency-review:
    name: Dependency review (what this PR adds)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # ── Frontend — lint + type check + unit tests (vitest) ─────────────────────
  # The same three steps as `npm run check` (frontend/package.json).
  frontend-tests:
    name: Frontend (lint + type check + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (package-lock.json, exact)
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

  # ── Model tests — runs only on pushes to main (expensive: ~800 MB downloads) ──
  # Not a gate: it needs model downloads and a live API key, so it may fail for
  # reasons outside the code.  Every deterministic test also runs in
  # fast-tests, which publish-image waits for.
  model-tests:
    name: Model tests (full pipeline, with model downloads)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: OpenSSL headers for the yara-python build (ADR-0079)
        run: dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev; }

      # As the image does (ADR-0080): torch alone from the PyTorch index, then
      # everything else from PyPI only, every file checked by hash.
      - name: Install all dependencies (the image's exact versions, by hash)
        run: |
          pip install --require-hashes --no-deps --index-url https://download.pytorch.org/whl/cpu \
            -r requirements-torch.lock.txt
          pip install --require-hashes -r requirements.lock.txt

      # Same versions for what both locks share: already installed, left alone.
      - name: Install test dependencies (by hash)
        run: pip install --require-hashes -r requirements-ci.lock.txt

      - name: Run full test suite (with model inference)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: pytest -v -rs --cov --cov-report=term-missing:skip-covered

  # ── Container image — build it and run the smoke test (ADR-0044) ─────────────
  # Keeps the Dockerfile from rotting: a dependency that no longer installs on
  # python:3.14-slim, or a hardening flag Chromium stops tolerating, fails here.
  container-image:
    name: Container image (build + smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # the image scan's results go to Code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ctiparsor:ci
          build-args: |
            GIT_REV=${{ github.sha }}

      # ADR-0078: the operating-system packages of the image (Debian under
      # python:3.14-slim, Chromium, libraries) are seen by no other check —
      # pip-audit and npm audit stop at the lock files.  Grype reports the
      # vulnerabilities that have a fix, the ones a rebuild or a base-image
      # bump can remove, to Code scanning; it does not fail the build: the
      # alerts are triaged there, like CodeQL's.
      - name: Scan the image (Grype, vulnerabilities with a fix)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ctiparsor:ci
          only-fixed: true
          fail-build: false
          output-format: sarif

      # A pull request from a fork gets no write token: its scan stays in the log.
      - name: Upload the image scan to Code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: container-image

      - name: Smoke test (health, UI, non-root, read-only root, Chromium sandbox, PostgreSQL job store)
        env:
          CTI_IMAGE: ctiparsor:ci
        run: |
          cp .env.example .env
          echo "CTI_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          bash scripts/docker_smoke.sh --no-build --clean

  # ── Publish to GHCR (ADR-0047) ────────────────────────────────────────────────
  # Only after the backend tests, the frontend tests and the smoke test pass
  # (an image whose code failed its own tests is never published), and only on main: a PR (including from a
  # fork) never has packages:write regardless — this `if` is defense in depth,
  # not the only control. Rebuilds with docker/build-push-action, but
  # cache-from: type=gha reuses the smoke-test job's layers, so this is a cheap
  # re-tag-and-push, not a second full build.
  #
  # ADR-0075: the pushed image gets a CycloneDX SBOM (syft) and two signed
  # attestations bound to its digest, build provenance and that SBOM, pushed
  # to GHCR next to it. A consumer checks them with
  # `gh attestation verify oci://ghcr.io/stixaly/ctiparsor@<digest> -R Stixaly/CTIParsor`.
  # No storage record: those exist for organisation-owned repositories only.
  publish-image:
    name: Publish image to GHCR
    needs: [fast-tests, frontend-tests, container-image, dependency-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # Sigstore signing certificate for the attestations
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase the image name (GHCR requires it; the repo owner is not)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (sha-<full sha>, latest, and semver if triggered by a v*.*.* tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM of the pushed image (CycloneDX, syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ctiparsor-image-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
