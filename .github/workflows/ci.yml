name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no push needed (ADR-0078): pip-audit, npm audit and the image
  # scan meet the vulnerabilities published since the last run, on the
  # versions already shipped.  Model tests and publishing stay push-only.
  schedule:
    - cron: "23 5 * * 1"

# Every job reads the repository and nothing else unless it says so below
# (publish-image, container-image).  The repository default is read-only too;
# this holds if that setting ever changes.
permissions:
  contents: read

jobs:
  # ── Fast tests — no model downloads, no API keys ──────────────────────────
  # ADR-0053: CTIParsor no longer supports SQLite — the rule store moved onto
  # PostgreSQL alongside the job store, so DATABASE_URL (here,
  # CTIPARSOR_TEST_DATABASE_URL for the temp_db fixture) is required even for
  # the "fast" unit tests. This is also why the once-separate postgres-tests
  # job below is gone: it ran the exact same suite against the exact same
  # service this job now also needs, so it was pure duplication once every
  # job requires PostgreSQL regardless.
  fast-tests:
    name: Fast tests (lint + type check + unit tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      # yara-python publishes no wheel for Python 3.14 (ADR-0079): pip compiles
      # it, and without the OpenSSL headers the build drops the `hash` module
      # and PE signatures silently (tests/test_yara_check.py would then fail).
      - name: OpenSSL headers for the yara-python build
        run: dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev; }

      # requirements/requirements-ci.lock.txt (`make lock`, ADR-0080): the API, the light
      # pipeline dependencies (no torch / transformers) and the test, lint and
      # audit tools, at the versions the image ships, every file checked
      # against the sha256 the lock recorded.
      - name: Install dependencies (by hash)
        run: pip install --require-hashes --no-deps -r requirements/requirements-ci.lock.txt

      # Scope and rules live in pyproject.toml, so `ruff check .` and `mypy`
      # check the same files here, in `make ci` and in an editor.
      - name: Lint (ruff)
        run: ruff check .

      # Every file names its copyright and licence (REUSE.toml, LICENSES/);
      # a file copied from another project needs its own entry there and a
      # line in THIRD_PARTY_NOTICES.md.
      - name: Licences (reuse lint)
        run: reuse lint

      # Blocking since the tree reached zero errors (2026-09-27); mypy is pinned
      # in requirements/requirements-dev.txt so a new release cannot fail this on its own.
      - name: Type check (mypy)
        run: mypy

      # tests/eval_pipeline.py runs here too (pytest.ini collects it).
      # CTIPARSOR_REQUIRE_TEST_DEPS turns a test skipped for a missing import
      # into a failure (tests/conftest.py).  Coverage: branch mode, the total
      # floor in pyproject.toml, then per-area floors (scripts/check_coverage.py).
      - name: Run unit tests
        env:
          SKIP_HEAVY_MODELS: "1"
          ANTHROPIC_API_KEY: "test-key-not-used"
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
          CTIPARSOR_REQUIRE_TEST_DEPS: "1"
        run: |
          pytest -v -rs \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Coverage floors per area (STIX mapping and validation, persistence)
        run: python scripts/check_coverage.py

      # ADR-0077 part B, ADR-0094 item 2: a database the last release wrote —
      # what an upgrading deployment holds — and, on a pull request, one its
      # base commit wrote — what deployments tracking main run until it merges
      # — migrate to this code's schema with every row's content and the state
      # volume's files intact, and this code's routes read them back
      # (scripts/check_migration_from.py).  On a push to main too, so the CI a
      # release waits for (docs/releasing.md, job step 3) has run it, and weekly.
      # actions/checkout fetched one commit and no tag: the last release tag
      # (the highest vX.Y.Z on origin) and the base commit are fetched at depth
      # 1.  The refs reach the script through the environment and a shell
      # variable, never through the command text.
      - name: Migrate databases written by the last release and the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: |
          set -o pipefail
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
                | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ -z "$tag" ]; then echo "no release tag vX.Y.Z on origin" >&2; exit 1; fi
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          refs=("$tag")
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            refs+=("$BASE_SHA")
          fi
          python scripts/check_migration_from.py "${refs[@]}"

      # ADR-0094 item 3: a used install, backed up with the pg_dump, pg_restore
      # and tar flags of docs/docker.md ("Data and backups") and restored into
      # an empty database and directory, comes back whole: every row, sequence,
      # schema object and file, and this code reads it back
      # (scripts/check_backup_restore.py).  pg_dump and pg_restore run in the
      # service's own container, as the docs run them in the stack's: the
      # runner's pg_dump, if any, is not the server's major.
      - name: Back up a used install and restore it into an empty one
        env:
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
          CTIPARSOR_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/check_backup_restore.py

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Dependency audit — the exact versions the image ships (ADR-0075) ────────
  # Blocking: a known vulnerability in requirements/requirements.lock.txt, or a high one in
  # the UI's production dependencies, fails the build unless SECURITY.md
  # accepts it with a reason. `--no-deps --disable-pip` audits the pins as
  # written, installing nothing; torch's +cpu build is not on PyPI, so
  # pip-audit says it cannot look it up and skips it.
  dependency-audit:
    name: Dependency audit (pip-audit on the lock, npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pip-audit (by hash, ADR-0080)
        run: pip install --require-hashes -r requirements/requirements-audit.lock.txt

      # The image's lock, CI's tools, the scanner's own dependencies and the uv
      # `make lock` runs, one run each: pip-audit refuses a package that two -r
      # files both list.  Every lock is audited before the step fails.
      - name: pip-audit (the four locks)
        run: |
          # No --ignore-vuln: diskcache (PYSEC-2026-2447, no fix) is no longer
          # in any lock (scripts/lock.sh); an exception added here goes in
          # SECURITY.md with its reason.
          status=0
          for lock in requirements/requirements.lock.txt requirements/requirements-ci.lock.txt requirements/requirements-audit.lock.txt requirements/requirements-uv.lock.txt; do
            echo "== $lock"
            pip-audit -r "$lock" --no-deps --disable-pip --progress-spinner off || status=1
          done
          exit "$status"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm audit (the UI's production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ── Dependency review — what a pull request adds (ADR-0078) ────────────────
  # The dependencies a PR adds or changes, in every manifest GitHub's
  # dependency graph reads (npm, actions, Python requirements): a known
  # vulnerability of high severity or worse fails the PR before it lands,
  # where dependency-audit above judges the whole lock after.
  dependency-review:
    name: Dependency review (what this PR adds)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # ── Frontend — lint + type check + unit tests (vitest) ─────────────────────
  # The same three steps as `npm run check` (frontend/package.json).
  frontend-tests:
    name: Frontend (lint + type check + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (package-lock.json, exact)
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

  # ── Browser journey — the built UI, the real API, its worker, PostgreSQL ────
  # ADR-0094 item 4: Playwright's Chromium drives the interface as an analyst
  # does (scripts/check_browser_e2e.sh, frontend/e2e/): a report imported,
  # followed through a reload, reviewed, completed and downloaded; a STIX
  # bundle enriched and its ledger read; a report that fails; a bundle the
  # schemas refused, answered 409; the same operations by keyboard alone; axe
  # on each page.  The API runs offline (no model, LLM, vision or CVE stage),
  # and --network-guard counts with iptables every packet it and its worker
  # send off loopback: any fails the job.  Traces, screenshots, videos and the
  # API's log are kept on failure only.
  browser-e2e:
    name: Browser journey (Playwright, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      # The same lock as fast-tests (yara-python is built there too): the API
      # and the offline pipeline need nothing else.
      - name: OpenSSL headers for the yara-python build
        run: dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev; }

      - name: Install dependencies (by hash)
        run: pip install --require-hashes --no-deps -r requirements/requirements-ci.lock.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the UI's packages (package-lock.json, exact)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Chromium is Playwright's own build for its version: cached by that version.
      - name: Playwright's version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Chromium's system libraries (Chromium from the cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Browser journey (offline, network guard)
        env:
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: bash scripts/check_browser_e2e.sh --network-guard

      - name: Keep the traces, screenshots, videos and the API's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ── Model tests — runs only on pushes to main (expensive: ~800 MB downloads) ──
  # Not a gate: it needs model downloads and a live API key, so it may fail for
  # reasons outside the code.  Every deterministic test also runs in
  # fast-tests, which publish-image waits for.
  model-tests:
    name: Model tests (full pipeline, with model downloads)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ctiparsor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ctiparsor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiparsor -d ctiparsor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: OpenSSL headers for the yara-python build (ADR-0079)
        run: dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev; }

      # As the image does (ADR-0080): torch alone from the PyTorch index, then
      # everything else from PyPI only, every file checked by hash.
      - name: Install all dependencies (the image's exact versions, by hash)
        run: |
          pip install --require-hashes --no-deps --index-url https://download.pytorch.org/whl/cpu \
            -r requirements/requirements-torch.lock.txt
          pip install --require-hashes --no-deps -r requirements/requirements.lock.txt

      # Same versions for what both locks share: already installed, left alone.
      - name: Install test dependencies (by hash)
        run: pip install --require-hashes --no-deps -r requirements/requirements-ci.lock.txt

      - name: Run full test suite (with model inference)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: "anthropic"
          CTIPARSOR_TEST_DATABASE_URL: postgresql://ctiparsor:ci@127.0.0.1:5432/ctiparsor
        run: pytest -v -rs --cov --cov-report=term-missing:skip-covered

  # ── Container image — build it once, then test that build (ADR-0044) ────────
  # Keeps the Dockerfile from rotting: a dependency that no longer installs on
  # python:3.14-slim, or a hardening flag Chromium stops tolerating, fails here.
  #
  # The only build of the image (ADR-0047 as amended on 2026-11-01).  It goes
  # into an OCI archive, the image index GHCR will hold; the scan, the smoke
  # test and the air-gap check run the image loaded from that archive; on a
  # push to main the archive goes to publish-image, which pushes it unchanged.
  # The job's output `digest` is the archive's index digest: the digest
  # publish-image must find in the registry.
  #
  # ubuntu-26.04, named rather than ubuntu-latest: its Docker 29 keeps images
  # in the containerd image store, which loads and pushes an image index
  # whole.  The classic store of ubuntu-24.04's Docker 28 cannot load the
  # archive at all.  The load step fails if the store is not containerd.
  container-image:
    name: Container image (build + smoke)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write   # the image scan's results go to Code scanning
    outputs:
      digest: ${{ steps.archive.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase the image name (GHCR requires it; the repo owner is not)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The OCI labels of the published image (title, source, revision,
      # version...), from the same inputs publish-image used to give them.
      # Only the labels: publish-image gives the image its names.
      - name: Labels of the published image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # An image index: the linux/amd64 image and BuildKit's SLSA v1
      # provenance of it (mode=max, builder-id = this run), the structure
      # GHCR has held since ADR-0075.  Stated here rather than left to the
      # action's default, which depends on the exporter (none with
      # `load: true`) and may change with a release of the action.
      - name: Build the image (an OCI archive)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ctiparsor:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REV=${{ github.sha }}
          provenance: mode=max,version=v1,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          outputs: type=oci,dest=${{ runner.temp }}/ctiparsor.oci.tar

      # The steps below run ctiparsor:ci, which must be the archive's image.
      # In the containerd image store `docker load` keeps the index whole,
      # attestation included, and the image's ID is the index digest: the log
      # shows both, and the step fails if they differ.
      - name: Load the archive as ctiparsor:ci (the image the steps below run)
        id: archive
        env:
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/ctiparsor.oci.tar
          drivers=$(docker info --format '{{json .DriverStatus}}')
          case "$drivers" in
            *'"io.containerd.snapshotter.v1"'*) ;;
            *)
              echo "::error::Docker's image store is $(docker info --format '{{.Driver}}') $drivers, not containerd: it cannot load the archive's image index. Run this job on ubuntu-26.04."
              exit 1 ;;
          esac
          index=$(tar -xOf "$archive" index.json | python3 -c '
          import json, sys
          images = json.load(sys.stdin)["manifests"]
          if len(images) != 1:
              sys.exit(f"index.json names {len(images)} images, not 1")
          print(images[0]["digest"])')
          if [ "$index" != "$BUILT" ]; then
            echo "::error::The archive's image index is $index; the build reported $BUILT"
            exit 1
          fi
          docker load --input "$archive"
          id=$(docker image inspect ctiparsor:ci --format '{{.Id}}')
          echo "The archive's image index: $index"
          echo "ctiparsor:ci, loaded: image ID $id"
          if [ "$id" != "$index" ]; then
            echo "::error::ctiparsor:ci is $id, not the archive's image ($index)"
            exit 1
          fi
          echo "digest=$index" >> "$GITHUB_OUTPUT"

      # ADR-0078: the operating-system packages of the image (Debian under
      # python:3.14-slim, Chromium, libraries) are seen by no other check —
      # pip-audit and npm audit stop at the lock files.  Grype reports the
      # vulnerabilities that have a fix, the ones a rebuild or a base-image
      # bump can remove, to Code scanning; it does not fail the build: the
      # alerts are triaged there, like CodeQL's.  .grype.yaml leaves out the
      # ones SECURITY.md accepts, each for the exact package version reviewed.
      - name: Scan the image (Grype, vulnerabilities with a fix)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ctiparsor:ci
          only-fixed: true
          fail-build: false
          output-format: sarif
          config: .grype.yaml

      # A pull request from a fork gets no write token: its scan stays in the log.
      - name: Upload the image scan to Code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: container-image

      # --backup-restore (ADR-0094 item 3): the backup and restore commands of
      # docs/docker.md, as written there, on this stack, restored into a second
      # project with empty volumes (scripts/check_backup_restore_docker.sh).
      - name: Smoke test (health, UI, non-root, read-only root, Chromium sandbox, PostgreSQL job store, backup and restore)
        env:
          CTI_IMAGE: ctiparsor:ci
        run: |
          cp .env.example .env
          echo "CTI_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          bash scripts/docker_smoke.sh --no-build --clean --backup-restore

      # The air-gap bundle's images must come back from `docker save` and
      # `docker load` under names Compose resolves, with no pull in between:
      # compose.yaml's references, or the plain tags a compose.override.yaml
      # names on the classic image store. Nothing else in CI runs the offline
      # installer.
      - name: Air-gap bundle images (save, load, resolve with no pull)
        env:
          CTI_IMAGE: ctiparsor:ci
        run: bash scripts/check_offline_images.sh --yes

      # Last, so only an archive whose image passed every step above leaves
      # the job.  A pull request, a fork's included, uploads nothing.  The
      # layers are gzip already: stored, not compressed again.  Kept one day,
      # long enough to re-run publish-image; overwritten when the whole
      # workflow is re-run, which builds a new archive.
      - name: Hand the archive to publish-image (pushes to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctiparsor-image
          path: ${{ runner.temp }}/ctiparsor.oci.tar
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # ── Publish to GHCR (ADR-0047) ────────────────────────────────────────────────
  # Only after the backend tests, the frontend tests and the smoke test pass
  # (an image whose code failed its own tests is never published), and only on main: a PR (including from a
  # fork) never has packages:write regardless — this `if` is defense in depth,
  # not the only control.
  #
  # Builds nothing (ADR-0047 as amended on 2026-11-01).  It loads the OCI
  # archive container-image built, scanned and smoke-tested, pushes it as
  # sha-<full sha> and fails unless the registry holds the digest
  # container-image reported.  Last, once the image is attested, it names
  # that digest latest, if this commit is still main's head.  On
  # ubuntu-26.04 for the containerd image store, as container-image.
  #
  # ADR-0075: the pushed image gets a CycloneDX SBOM (syft) and two signed
  # attestations bound to its digest, build provenance and that SBOM, pushed
  # to GHCR next to it. A consumer checks them with
  # `gh attestation verify oci://ghcr.io/stixaly/ctiparsor@<digest> -R Stixaly/CTIParsor`.
  # No storage record: those exist for organisation-owned repositories only.
  #
  # ADR-0085: a release (tag vX.Y.Z, release.yml) rebuilds nothing.  It gives
  # the image this job pushed for the tagged commit the version as a second
  # name, by digest, so this job's attestations are the release's too.
  publish-image:
    name: Publish image to GHCR
    needs: [fast-tests, frontend-tests, browser-e2e, container-image, dependency-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write          # Sigstore signing certificate for the attestations
      attestations: write

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase the image name (GHCR requires it; the repo owner is not)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The archive container-image tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctiparsor-image
          path: ${{ runner.temp }}

      # The containerd image store pushes the loaded index as it is, the
      # attestation manifest and every blob with their digests.  The digest
      # GHCR then serves is read back and compared.  Version names (X.Y.Z,
      # X.Y) come from release.yml (ADR-0085): this workflow never runs on a
      # tag.
      - name: Push the archive as sha-<full sha>, same digest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TESTED: ${{ needs.container-image.outputs.digest }}
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/ctiparsor.oci.tar
          drivers=$(docker info --format '{{json .DriverStatus}}')
          case "$drivers" in
            *'"io.containerd.snapshotter.v1"'*) ;;
            *)
              echo "::error::Docker's image store is $(docker info --format '{{.Driver}}') $drivers, not containerd: it cannot push the archive's image index unchanged. Run this job on ubuntu-26.04."
              exit 1 ;;
          esac
          docker load --input "$archive"
          id=$(docker image inspect ctiparsor:ci --format '{{.Id}}')
          if [ "$id" != "$TESTED" ]; then
            echo "::error::The archive's image is $id, not the image container-image tested ($TESTED)"
            exit 1
          fi
          docker tag ctiparsor:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          got=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])') || got=""
          if [ "$got" != "$TESTED" ]; then
            echo "::error::$IMAGE:sha-$GITHUB_SHA is ${got:-missing}, not the image container-image tested ($TESTED)"
            exit 1
          fi
          echo "$IMAGE:sha-$GITHUB_SHA -> $got"
          echo "digest=$TESTED" >> "$GITHUB_OUTPUT"

      - name: SBOM of the pushed image (CycloneDX, syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ctiparsor-image-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      # latest follows main: it moves only to an attested image, and only
      # while this commit is still main's head.  A run that finishes after a
      # newer push, or a re-run of an old run, leaves it where it is; its
      # sha-<full sha> stays published and attested.
      - name: Name it latest (if this commit is still main's head)
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TESTED: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, not $GITHUB_SHA: latest is left as it is. $IMAGE:sha-$GITHUB_SHA is published and attested."
            exit 0
          fi
          docker tag ctiparsor:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
          got=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])') || got=""
          if [ "$got" != "$TESTED" ]; then
            echo "::error::$IMAGE:latest is ${got:-missing}, not the image container-image tested ($TESTED)"
            exit 1
          fi
          echo "$IMAGE:latest -> $got"
