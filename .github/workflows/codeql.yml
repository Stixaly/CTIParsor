name: CodeQL

# Static security analysis of the Python and the TypeScript (ADR-0075).
# Findings land in the repository's Security tab; the job fails only if the
# analysis itself cannot run, so a finding is triaged there, not in CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly, for queries that improve between pushes

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v6

      # Both languages are interpreted: no build step, nothing installed.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
