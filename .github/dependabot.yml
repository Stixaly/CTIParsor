# What Dependabot keeps current, and what it leaves to `make lock` (ADR-0075).
#
# Python is not here: requirements/requirements.lock.txt is compiled by `uv pip compile`
# (`make lock`), which Dependabot neither regenerates (its uv support reads a
# uv.lock) nor treats as pip-compile output, so it would bump single pins and
# leave the rest of the resolution stale. The `pip-audit` CI job fails on a
# known vulnerability in the lock instead, and `make update-deps` re-resolves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of the Dockerfile and the images compose.yaml pins by digest
  # (lot 0, D11): a new digest arrives as a PR, never silently.  Not a new
  # Python minor or major: the locks are resolved for the image's Python, so
  # moving to 3.15 is its own change (ADR-0079), re-resolved with `make lock`;
  # a 3.14 patch still arrives here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
