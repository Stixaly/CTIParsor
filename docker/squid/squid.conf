# Egress filter for the Chromium web-capture tab (pipeline/web_capture.py,
# ADR-0029). This is an independent, proxy-side re-check of the exact SSRF
# policy `validate_url`/`_ip_is_public` already enforce in Python -- it exists
# to close the gap `_dns_pin_arg`'s docstring documents as open: Chromium
# resolves a subresource's hostname on its own, independently of Python's
# check, and a hostile nameserver can answer differently the second time
# (DNS rebinding). Routing Chromium's traffic through this proxy means the
# resolution that decides whether a destination is reachable and the
# connection that uses it happen in the same step, in the same process --
# there is no longer a window between "checked" and "connected" for a second
# DNS answer to land in.
#
# Mounted read-only at /etc/squid/squid.conf; the container has no other
# config and no disk cache (see compose.yaml's capture-proxy service).

http_port 3128

# This proxy exists to filter, not to speed anything up -- no disk cache, and
# the container's root filesystem is read-only anyway.
cache deny all
coredump_dir /tmp

# --- destination policy: mirrors pipeline/web_capture.py::_ip_is_public -----
# (private, loopback, link-local, reserved, multicast, unspecified -- the
# same six checks, expressed as the CIDR blocks that back them.)
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
# 255.255.255.255/32 is already inside 240.0.0.0/4 -- Squid warns (and ignores
# one of the two) if both are listed.
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst ::/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dst dst ff00::/8
acl blocked_dst dst 64:ff9b::/96
acl blocked_dst dst ::ffff:0:0/96

# Only the ports pipeline/web_capture.py::_ALLOWED_PORTS considers a public
# site; anything else (5432, 6379, 9200, 11434...) is far more likely to be an
# internal service than a CTI blog, same reasoning as the Python-side check.
acl capture_ports port 80 443 8080 8443

http_access deny blocked_dst
http_access allow capture_ports
http_access deny all
