# TLS + password gate in front of CTIParsor (docs/deployment.md option C).
# The application itself has no authentication: this file is the gate.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cti.crt;
    ssl_certificate_key /etc/nginx/certs/cti.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:CTI:10m;
    ssl_session_tickets off;

    auth_basic           "CTIParsor";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Reports are uploaded whole; the API rejects anything over 50 MB itself.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pipeline progress is a Server-Sent Events stream and a run can take
        # many minutes. Without these, nginx buffers the stream and times the
        # connection out mid-job, so the UI freezes on a running report.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }
}
