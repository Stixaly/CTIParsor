# CTIParsor — Docker Compose stack
# See docs/docker.md and ADR-0044 for the full deployment model.
#
#   docker compose up -d                                   # API + web UI on http://127.0.0.1:8000
#   docker compose --profile bootstrap run --rm bootstrap   # once: models, corpora, rule store
#   docker compose --profile proxy --profile ollama up -d   # optional: TLS+password front, local LLM

name: ctiparsor

# Delivers CTI_DB_PASSWORD to containers as a bind-mounted file at
# /run/secrets/db_password instead of a plain `environment:` value: the value
# then never appears in `docker inspect`/`docker compose config` output or
# /proc/<pid>/environ on any container that doesn't mount it. `make docker-up`
# / `make docker-bootstrap` / `scripts/docker_smoke.sh` all materialize
# .secrets/db_password from CTI_DB_PASSWORD before calling `docker compose up`
# (see Makefile) -- Compose's own `secrets:` directive was tried first, but
# its `environment:`-sourced form refuses to attach to a `read_only: true`
# service ("`file` is the sole supported option"), which every service here
# is; a plain bind mount has no such restriction. docker/entrypoint.sh reads
# the file into PGPASSWORD for libpq/psycopg (which has no *_FILE convention
# of its own); the official postgres image supports POSTGRES_PASSWORD_FILE
# natively.
x-app-image: &app-image
  image: ${CTI_IMAGE:-ctiparsor:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_REV: ${CTI_GIT_REV:-}
      INSTALL_CAPTURE: ${CTI_INSTALL_CAPTURE:-true}

# Where the app finds its job store AND its rule store (ADR-0045, ADR-0053
# -- both stores are this one PostgreSQL database).  The password itself is
# delivered via the .secrets/db_password bind mount (see each service's
# `volumes:`), not this block -- DATABASE_URL carries no password, so it
# needs no percent-encoding and never sits inside a URL that a log line
# could print.
x-job-store: &job-store
  DATABASE_URL: postgresql://${CTI_DB_USER:-ctiparsor}@postgres:5432/${CTI_DB_NAME:-ctiparsor}

x-app-hardening: &app-hardening
  read_only: true                      # the image is immutable at runtime; state lives on the volumes
  tmpfs:
    - /tmp:mode=1777                   # Chromium profiles, matplotlib, scratch files
    - /home/ctiparsor:uid=1001,gid=1001,mode=0700
  cap_drop:
    - ALL                              # nothing in the pipeline needs a capability
  security_opt:
    - no-new-privileges:true           # no setuid escalation, even if a binary had the bit
    - seccomp=./docker/seccomp-chromium.json   # Docker's default profile + user namespaces, so the Chromium sandbox stays ON
  # The pids cap (a fork bomb from a hostile document stops there) lives in
  # each service's deploy.resources.limits block: Compose maps pids_limit onto
  # that key and refuses the two side by side.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  app:
    <<: [*app-image, *app-hardening]
    env_file: ${CTI_ENV_FILE:-.env}   # the same file that configures a host install
    environment:
      # Fixed on purpose: a value in .env must not be able to bind the API to
      # loopback inside the container (unreachable) or turn on the reloader.
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "0"
      # The API only accepts and queues reports; the `worker` service runs
      # them (ADR-0046).  This container therefore never loads a model.
      CTIPARSOR_ROLE: api
      # Routes the URL-capture tab's Chromium through capture-proxy below —
      # see that service's comment for why.
      CTIPARSOR_CAPTURE_PROXY: http://capture-proxy:3128
      <<: *job-store
    depends_on:
      postgres:
        condition: service_healthy
      capture-proxy:
        condition: service_started
    ports:
      - "${CTI_BIND:-127.0.0.1}:${CTI_PORT:-8000}:8000"
    volumes:
      - cti-state:/app/state
      - ./.secrets/db_password:/run/secrets/db_password:ro
      - cti-cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama / LM Studio / vLLM on the host
    networks:
      - frontend      # egress (LLM APIs, HuggingFace, corpora) and the proxy
      - backend       # the database, internal only
      - llm           # the optional ollama service
    # Measured 130 MB idle; a Settings-page corpus rebuild parses 87k rules in
    # this process and peaked at 2.2 GB, hence the headroom.
    deploy:
      resources:
        limits:
          cpus: "${CTI_APP_CPUS:-2}"
          memory: ${CTI_APP_MEMORY:-3g}
          pids: 4096
        reservations:
          memory: 512m
    restart: unless-stopped
    stop_grace_period: 30s

  # The pipeline (ADR-0046): claims queued reports from the job store, runs
  # each in an isolated subprocess, heartbeats the rows it owns.  Same image and
  # hardening as `app`; no port; shares the two volumes (uploads in, outputs
  # out) and reaches the LLM providers through `frontend`.  Scale it with
  # `docker compose up -d --scale worker=2` — each replica takes its own memory
  # limit, and the lease on `jobs` keeps them from running the same report.
  worker:
    <<: [*app-image, *app-hardening]
    command: ["worker"]
    env_file: ${CTI_ENV_FILE:-.env}
    environment:
      CTIPARSOR_ROLE: worker
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-1}
      <<: *job-store
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cti-state:/app/state
      - cti-cache:/app/cache
      - ./.secrets/db_password:/run/secrets/db_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend
      - backend
      - llm
    # The loop touches this file on every poll (WORKER_POLL_S, 2 s); two minutes
    # without a touch means the supervisor is wedged, not merely busy.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/ctiparsor-worker.alive -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Each running report holds ~4.4 GB (ADR-0037); the limit is
    # WORKER_MAX_CONCURRENT x 4.4 GB + 1 GB for the supervisor.  When it is hit
    # the OOM killer takes the pipeline subprocess, and the job is marked
    # failed; the supervisor survives.  OMP_NUM_THREADS=2 per subprocess, so
    # 4 CPUs serve one report comfortably.
    deploy:
      resources:
        limits:
          cpus: "${CTI_WORKER_CPUS:-4}"
          memory: ${CTI_WORKER_MEMORY:-6g}
          pids: 4096
        reservations:
          memory: 4g
    restart: unless-stopped
    # WORKER_DRAIN_S (60 s) for running reports to finish, then they are
    # requeued and resume from their Stage 3 checkpoint on the next worker.
    stop_grace_period: 90s

  # Same image and hardening, one-shot, no port.
  bootstrap:
    <<: [*app-image, *app-hardening]
    profiles: [bootstrap]
    command: ["bootstrap"]
    env_file: ${CTI_ENV_FILE:-.env}
    environment:
      <<: *job-store
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cti-state:/app/state
      - cti-cache:/app/cache
      - ./.secrets/db_password:/run/secrets/db_password:ro
    networks:
      - frontend      # bootstrap downloads models and clones corpora: it needs egress
      - backend
    # Model downloads plus the same 2.2 GB rule parse the API's rebuild does.
    deploy:
      resources:
        limits:
          cpus: "${CTI_BOOTSTRAP_CPUS:-2}"
          memory: ${CTI_BOOTSTRAP_MEMORY:-4g}
          pids: 4096
    restart: "no"
    healthcheck:
      disable: true

  # The job store (ADR-0045) AND the detection-rule corpus (ADR-0053: no
  # more SQLite file on cti-state -- both stores are PostgreSQL now).  No
  # published port: only the app and worker reach it.
  # The official image runs as its `postgres` user (uid 70 on alpine) when told
  # to; with the data directory on a named volume nothing needs root, so every
  # capability is dropped and the root filesystem is read-only (the socket
  # directory and /tmp are tmpfs).  Back it up with pg_dump (docs/docker.md).
  postgres:
    image: postgres:17-alpine
    user: "70:70"
    environment:
      POSTGRES_USER: ${CTI_DB_USER:-ctiparsor}
      POSTGRES_DB: ${CTI_DB_NAME:-ctiparsor}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # scram-sha-256 for every connection, local socket included (the image's
      # default only applies it to host connections).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./.secrets/db_password:/run/secrets/db_password:ro
    tmpfs:
      - /tmp
      - /run/postgresql
    read_only: true
    shm_size: 256m                       # PostgreSQL's shared buffers; Docker's 64 MB default is short
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CTI_DB_USER:-ctiparsor} -d ${CTI_DB_NAME:-ctiparsor}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # The job store is a few MB per report; the default shared_buffers of
    # 128 MB and a handful of connections fit comfortably in 512 MB.
    deploy:
      resources:
        limits:
          cpus: "${CTI_DB_CPUS:-1}"
          memory: ${CTI_DB_MEMORY:-512m}
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - backend
    restart: unless-stopped

  # Development/test runner (ADR-0054): the pipeline/API/tests run only in
  # containers now, so this is what replaces the old venv workflow. Same
  # image as `app`/`worker` (all Python packages already baked into
  # /opt/venv), but with the repo bind-mounted live over /app instead of the
  # image's baked-in COPY -- edits on the host are picked up with no rebuild.
  # `tests/` is deliberately absent from the built image (.dockerignore) for
  # exactly this reason: it was never meant to ship in `app`/`worker`, only
  # to arrive via this bind mount.
  #
  # Not `*app-hardening`: needs to WRITE (.pytest_cache, __pycache__, edited
  # source stays as edited), so `read_only` is off; cap_drop/no-new-
  # privileges/the Chromium seccomp profile stay on as cheap defense in
  # depth since this container runs the same pipeline code `worker` does.
  # Bind-mounting `.` over `/app` also replaces the image's uploads/output/
  # corpora symlinks with this repo's own `uploads/`/`output/`/`corpora/`
  # directories -- which is why `docker compose run --rm dev cli
  # input/report.pdf` (dispatched by entrypoint.sh like any other command)
  # reads/writes those paths directly on the host, no extra bind mount
  # needed the way the hardened `app` service would.
  #
  # Performance note (ADR-0037's WSL /mnt/ measurement, re-examined for
  # ADR-0054): that finding was SQLite doing random-access reads against a
  # 644 MB file (gone entirely -- Postgres runs in its own container,
  # unaffected by host bind-mount performance) and Torch/HF imports reading
  # ~2 GB of .so files from /mnt/ (avoided here because /opt/venv stays
  # inside the image, never bind-mounted -- only the few hundred small .py
  # files cross the bind mount, a completely different I/O profile).
  dev:
    <<: [*app-image, *app-hardening]
    read_only: false
    profiles: [dev]
    env_file: ${CTI_ENV_FILE:-.env}
    environment:
      # Tests create a disposable PostgreSQL schema per run (temp_db in
      # tests/conftest.py) against this same server -- safe to share with
      # the real job/rule store, nothing touches the default schema.
      CTIPARSOR_TEST_DATABASE_URL: postgresql://${CTI_DB_USER:-ctiparsor}@postgres:5432/${CTI_DB_NAME:-ctiparsor}
      SKIP_HEAVY_MODELS: "1"
      <<: *job-store
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - cti-cache:/app/cache
      - ./.secrets/db_password:/run/secrets/db_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend
      - backend
      - llm
    command: ["pytest", "tests/", "-v"]

  # Frontend hot-reload (ADR-0054) -- the docker-world equivalent of the old
  # `cd frontend && npm run dev`. Same base image as the Dockerfile's own
  # `ui` build stage (node:24-bookworm-slim), bind-mounts frontend/ instead
  # of copying it, so edits show up through Vite's HMR with no rebuild.
  # Talks to `app` over the published API port (same-origin API calls the
  # built frontend already makes; see frontend/vite.config.ts for the dev
  # proxy target) rather than joining the backend/llm networks -- it never
  # needs to reach Postgres or an LLM provider directly.
  frontend-dev:
    image: node:24-bookworm-slim
    profiles: [dev]
    working_dir: /ui
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/ui
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - frontend

  # No published port: only the app reaches it, at OLLAMA_BASE_URL=http://ollama:11434
  # Pull a model once with: docker compose exec ollama ollama pull mistral
  # GPU passthrough needs the NVIDIA container toolkit plus a deploy.resources.reservations.devices block:
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.34.1
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - llm           # not `backend`: ollama needs egress to pull models, the database must not have any
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Sized for a 7B model in Q4 on CPU (~5-6 GB resident plus context).  A
    # 27B model needs ~18 GB and a GPU: raise CTI_OLLAMA_MEMORY and add the
    # device reservation above.
    deploy:
      resources:
        limits:
          cpus: "${CTI_OLLAMA_CPUS:-8}"
          memory: ${CTI_OLLAMA_MEMORY:-12g}
    restart: unless-stopped

  # TLS + HTTP basic auth in front of the app (docs/deployment.md option C).
  # The app port stays on loopback, the proxy is the only thing published on the network.
  # Certificate, key and htpasswd are created by the operator (see docs/docker.md).
  proxy:
    profiles: [proxy]
    image: nginxinc/nginx-unprivileged:1.28-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CTI_TLS_BIND:-0.0.0.0}:${CTI_TLS_PORT:-8443}:8443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/htpasswd:/etc/nginx/htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "${CTI_PROXY_CPUS:-0.5}"
          memory: ${CTI_PROXY_MEMORY:-128m}
    restart: unless-stopped

  # Egress filter for the URL-capture tab's Chromium (`app`, ADR-0029) — always
  # on, not behind a profile. `validate_url`/`_dns_pin_arg` in
  # pipeline/web_capture.py already check every URL and pin the navigated
  # host's DNS answer, but a subresource on a *different* host (an `<img>` on
  # an attacker's second domain) is re-checked in Python and then resolved a
  # second, independent time by Chromium itself — a hostile nameserver can
  # answer that second lookup with 169.254.169.254 or an RFC1918 address
  # (classic DNS rebinding; see that docstring for the full analysis). Routing
  # Chromium through this proxy closes it: Squid resolves and connects in the
  # same step, so there is no window between "checked" and "connected" left
  # for a second DNS answer to land in. docker/squid/squid.conf mirrors the
  # exact ranges pipeline/web_capture.py::_ip_is_public blocks.
  #
  # Runs as the image's own `proxy` user (uid/gid 13) rather than root: with
  # `cap_drop: [ALL]` the entrypoint's usual setuid/setgid privilege-drop has
  # no capability to do it with and Squid aborts (measured) — starting
  # already-unprivileged skips that step entirely. The ICMP pinger also loses
  # its raw socket under `cap_drop: [ALL]` and logs a startup warning; harmless
  # here, since nothing in this config defines a `cache_peer` for it to probe.
  capture-proxy:
    image: ubuntu/squid:latest
    user: "13:13"
    read_only: true
    tmpfs:
      - /run:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    restart: unless-stopped

# Three networks, each with one job.  `backend` is internal: Docker gives it no
# default route, so the database cannot reach the internet even if compromised —
# the app still can, through `frontend`.  The proxy never sees the database or
# the LLM; the LLM never sees the proxy or the database.
networks:
  frontend: {}
  backend:
    internal: true
  llm: {}

# cti-state and pg-data are what a backup must contain (uploads and outputs
# on the first; both the job store and the rule store on the second, since
# ADR-0053 — pg_dump it); cti-cache can be dropped and rebuilt with
# bootstrap.
volumes:
  cti-state: {}
  cti-cache: {}
  pg-data: {}
  ollama-models: {}
