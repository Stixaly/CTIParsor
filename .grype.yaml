# Grype's configuration for the image scan (ci.yml, container-image job).
#
# Vulnerabilities reviewed and accepted in SECURITY.md ("Accepted
# vulnerabilities"), with the reason they cannot be reached from CTIParsor.
# Each rule names the exact package and version it was reviewed for: when the
# image moves to another Python, the rule stops matching and Grype reports
# the CVE again, for a new review.  A rule is added here only together with
# its row in SECURITY.md.
ignore:
  # poplib command injection: fixed in 3.15 only.  CTIParsor never imports poplib.
  - vulnerability: CVE-2025-15367
    reason: "Unreachable: CTIParsor never imports poplib (SECURITY.md, reviewed 2026-10-31)"
    package:
      name: python
      version: 3.14.10
      type: binary

  # tempfile.TemporaryDirectory cleanup race: fixed in 3.15 only.  Needs a local
  # attacker who changes the directory tree while it is cleaned up; the
  # container's /tmp and model cache are written by the application's user only.
  - vulnerability: CVE-2026-12345
    reason: "Not exploitable: needs write access to the container's /tmp or model cache (SECURITY.md, reviewed 2026-10-31)"
    package:
      name: python
      version: 3.14.10
      type: binary
