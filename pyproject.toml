[tool.ruff]
line-length = 120
# The scope is the repository, so `ruff check .` checks the same files in CI,
# in `make ci` and in an editor; the CI command once listed directories by
# hand and left scripts/ out.  Gitignored trees are skipped, and these are
# named too: in the `dev` container cache/ is a volume holding the corpus
# clones, third-party code that no .gitignore entry covers.
extend-exclude = ["cache", "corpora", "offline", "data", "frontend"]

[tool.ruff.lint]
# Pinned so a bare `ruff check` matches CI.  Without an explicit `select`, ruff
# falls back to E4,E7,E9,F -- which silently omits both I (import sorting) and
# E501 (line length), despite `line-length` being set right above.  That gap let
# an unsorted import block and a 147-column line reach a commit while local
# linting reported clean.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# E402 (module-level import not at top of file): intentional throughout this
# codebase -- logging must be configured before other modules are imported,
# so setup_logging()/get_logger() calls precede subsequent imports.
"*.py" = ["E402"]

[tool.mypy]
# A bare `mypy` checks what CI checks.
files = ["pipeline", "api", "models", "evaluation"]
ignore_missing_imports = true
# Tightened step by step, each flag once the tree passes it (2026-10-03).
# check_untyped_defs: the bodies of functions without annotations are checked
# too, not skipped.  Measured next steps: warn_return_any (28 errors),
# warn_unreachable (27), disallow_incomplete_defs (140).  warn_unused_ignores
# is out: an ignore needed with one set of optional packages is unused with
# another, so CI and the dev image would disagree.
check_untyped_defs = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
# Pydantic models declare defaults via `Field(default, ...)`; without this
# plugin mypy can't see through `Field()` and reports spurious "Missing named
# argument" errors for every constructor call (e.g. ChunkConfig(), LLMConfig()).
plugins = ["pydantic.mypy"]

# OpenCTI's Snort parser, copied unmodified so it stays the parser OpenCTI runs
# (ADR-0070): its implicit Optionals are OpenCTI's, not ours to rewrite.
[[tool.mypy.overrides]]
module = "pipeline.detection.opencti_snort.*"
ignore_errors = true

[tool.coverage.run]
# Branch coverage: a line run on one side of an `if` no longer counts the
# other side as tested.
branch = true
source = ["pipeline", "api", "models"]
# OpenCTI's Snort parser, copied unmodified (ADR-0070), like for mypy above.
omit = ["pipeline/detection/opencti_snort/*"]

[tool.coverage.report]
# A floor, not a target: CI's fast-tests job measured 88.0% on 2026-10-03;
# a point under it, so coverage cannot slide unnoticed.  Raise it as tests land.
# The per-area floors are in scripts/check_coverage.py.
fail_under = 87
precision = 1

# pytest's own settings are in pytest.ini, which pytest reads first.
