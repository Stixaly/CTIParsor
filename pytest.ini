[pytest]
# tests/eval_pipeline.py holds 10 test functions (the ADR-0011 Phase D adversarial
# precision tests and the ADR-0023 Phase 1 ATE tests) but does not match pytest's
# default test_*.py glob, so it was collected zero times by `pytest` and by CI.
# Name it explicitly rather than renaming the file, which is also a CLI entry
# point documented across the README and several ADRs.
python_files = test_*.py *_test.py eval_pipeline.py

# Without this, a bare `pytest` from the repo root walks into corpora/ and
# collects the vendored SigmaHQ suite — 14 tests that belong to a third-party
# corpus, not to this project. `make test` always passed `tests/` explicitly, so
# the two disagreed on the total (1044 vs 1030) depending on how you invoked it.
testpaths = tests

filterwarnings =
    # Third-party: Starlette's TestClient emits this when httpx (not httpx2) is
    # installed.  It's not actionable from our code without changing the pinned
    # dependency, so ignore this one specific message to keep CI logs clean
    # without suppressing warnings from our own code.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    # Third-party: transformers' deberta_v2 modeling module (imported by GLiNER
    # and CyNER, both DeBERTa-v3) decorates a helper with @torch.jit.script at
    # import time, which the pinned torch deprecates.  Only the model-tests job
    # installs torch; nothing in our code calls torch.jit.
    ignore:`torch.jit.script` is deprecated:FutureWarning
