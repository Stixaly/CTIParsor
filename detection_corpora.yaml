# Detection-rule corpus registry — PUBLIC corpuses (ADR-0006).
#
# This file is COMMITTED so a fresh clone reproduces the same coverage:
#   python scripts/sync_corpora.py          # clone/pull (public = no auth)
#   python scripts/build_detection_index.py # ingest into the rule store
#
# Private corpuses and local overrides go in detection_corpora.local.yaml
# (gitignored) — see detection_corpora.local.yaml.example. That overlay is merged
# over this file (override by `name`, append new).
#
# Clones live under ./corpora/ (gitignored — large, owned upstream).
# `license` is honored on export/drill-down — public does NOT mean unrestricted.

# `priority` (ADR-0010): dedup precedence — lower wins as the canonical rule when
# the same detection logic appears in several corpora. `subdir` scopes a large
# clone to its rule subtree. Licenses are VERIFIED from each repo (2026-06-19);
# `none` = no LICENSE file upstream (all-rights-reserved) — safe to ingest for
# coverage, restricted to redistribute. License is carried to drill-down, not
# auto-enforced, so the operator decides what to export.

corpora:
  - name: sigmahq
    adapter: sigma
    path: ./corpora/sigmahq
    git:  https://github.com/SigmaHQ/sigma.git
    license: DRL-1.1            # SigmaHQ Detection Rule License
    priority: 10
    private: false
    enabled: true

  # DISABLED (2026-06-21): upstream `main` ships only LICENSE+README — the rules
  # were reworked onto transient PR branches (e.g. 30043-pr-rules, ~60 rules) with
  # no stable default branch to track, and sync_corpora.py clones the default
  # branch only. Re-enable if upstream restores rules to `main`.
  - name: dfir-report
    adapter: sigma
    path: ./corpora/dfir-report
    git:  https://github.com/The-DFIR-Report/Sigma-Rules.git
    license: GPL-3.0
    priority: 20
    private: false
    enabled: false

  - name: tsale
    adapter: sigma
    path: ./corpora/tsale
    git:  https://github.com/tsale/Sigma_rules.git
    license: GPL-3.0
    priority: 30
    private: false
    enabled: true

  - name: p4t12ick
    adapter: sigma
    path: ./corpora/p4t12ick
    git:  https://github.com/P4T12ICK/Sigma-Rule-Repository.git
    license: GPL-3.0
    priority: 40
    private: false
    enabled: true

  - name: russianpanda
    adapter: sigma
    path: ./corpora/russianpanda
    git:  https://github.com/RussianPanda95/Sigma-Rules.git
    license: none              # no LICENSE upstream — all rights reserved
    priority: 50
    private: false
    enabled: true

  - name: linkedin
    adapter: sigma
    path: ./corpora/linkedin
    git:  https://github.com/linkedin/sigma-rules.git
    license: BSD-2-Clause
    priority: 60
    private: false
    enabled: true

  - name: mthcht
    adapter: sigma
    path: ./corpora/mthcht
    git:  https://github.com/mthcht/ThreatHunting-Keywords-sigma-rules.git
    license: none              # no LICENSE upstream — all rights reserved
    priority: 90              # large, auto-generated; low dedup authority
    subdir: sigma_rules
    private: false
    enabled: true

  - name: hayabusa
    adapter: sigma
    path: ./corpora/hayabusa
    git:  https://github.com/Yamato-Security/hayabusa-rules.git
    license: DRL-1.1
    priority: 95             # embeds a converted SigmaHQ copy — dedup folds it under sigmahq
    subdir: sigma
    private: false
    enabled: true

  # ── YARA (ADR-0015) ────────────────────────────────────────────────────────
  # DISABLED until the `yara` adapter lands — registry.iter_rules() skips an
  # unknown adapter with a warning, so enabling these early only adds log noise.
  # Clones are already present under ./corpora/. Licences VERIFIED from each repo
  # (2026-08-16), not assumed: signature-base is DRL-1.1 — the same licence as
  # SigmaHQ — NOT the CC BY-NC it is often reported to be.
  # Rule counts measured by parsing the clones, not taken from upstream READMEs.

  - name: yara-rules
    adapter: yara
    path: ./corpora/yara-rules
    git:  https://github.com/Yara-Rules/rules.git
    license: GPL-2.0
    priority: 110            # 12,336 rules — the broadest public set
    private: false
    enabled: false

  - name: signature-base
    adapter: yara
    path: ./corpora/signature-base
    git:  https://github.com/Neo23x0/signature-base.git
    license: DRL-1.1
    priority: 100            # 5,990 rules — highest signal/noise, so best dedup authority
    subdir: yara
    private: false
    enabled: false

  - name: elastic-artifacts
    adapter: yara
    path: ./corpora/elastic-artifacts
    git:  https://github.com/elastic/protections-artifacts.git
    license: Elastic-2.0     # restricted — flagged on export, ingested for coverage
    priority: 120            # 2,877 rules; the only corpus carrying `os =` meta
    subdir: yara
    private: false
    enabled: false

  - name: rl-yara
    adapter: yara
    path: ./corpora/rl-yara
    git:  https://github.com/reversinglabs/reversinglabs-yara-rules.git
    license: MIT
    priority: 130            # 1,240 rules
    subdir: yara
    private: false
    enabled: false

  - name: inquest-yara
    adapter: yara
    path: ./corpora/inquest-yara
    git:  https://github.com/InQuest/yara-rules.git
    license: MIT
    priority: 140            # 39 rules — small but high quality
    private: false
    enabled: false

  # ── Suricata (ADR-0015) ────────────────────────────────────────────────────
  # ET Open is published ONLY as a tarball, so it needs the `tarball:` source
  # type ADR-0015 §5 adds to sync_corpora.py — `git:` cannot fetch it.
  # 51,799 active rules (+19,479 shipped commented-out, which the adapter skips;
  # all 3,329 `ET DELETED` deprecated rules live in that commented block).

  - name: et-open
    adapter: suricata
    path: ./corpora/et-open
    tarball: https://rules.emergingthreats.net/open/suricata-7.0.3/emerging.rules.tar.gz
    # ET ships THREE licences keyed to sid range (see LICENSE in the tarball):
    # GPLv2 for sids 1-3464 and 100000000-100000908, BSD for 2000000-2799999.
    # Verified 2026-08-16: all 51,799 active rules fall in the BSD range, so the
    # corpus-level licence is accurate *for this distribution*. Re-check on
    # upgrade — a future drop containing GPLv2 sids would need per-rule licence.
    license: BSD-3-Clause
    priority: 200            # largest corpus by far; low dedup authority
    subdir: rules
    private: false
    enabled: false

  - name: tbg-hunting
    adapter: suricata
    path: ./corpora/tbg-hunting
    git:  https://github.com/travisbgreen/hunting-rules.git
    license: GPL-3.0
    priority: 210            # 682 rules — hunting-oriented, high false-positive rate by design
    private: false
    enabled: false

  # NOT INGESTED — ptresearch/AttackDetection (~14k Suricata rules): the LICENSE
  # is a Positive Technologies proprietary EULA, not an open licence, and PT is a
  # US-sanctioned entity. Excluded on compliance grounds, not technical ones.
